services:
  dashboard:
    build: ./web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pulse-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pulse -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 15
  backend:
    # Benchmarks may select a prebuilt variant; the default is the image built here.
    image: ${PULSE_BACKEND_IMAGE:-pulse-backend}
    build:
      context: .
      args:
        SERVICE: backend
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
      DEBUG_ADDR: ":6060"
    ports:
      - "127.0.0.1:8080:8080"
      # pprof, expvar and connection-pool statistics; loopback-only, local diagnostics.
      - "127.0.0.1:6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
  sampleapp:
    build:
      context: .
      args:
        SERVICE: sampleapp
    environment:
      APP_VERSION: ${APP_VERSION:-v1}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
  agent:
    build:
      context: .
      args:
        SERVICE: agent
    environment:
      NODE_ID: node-1
      APP_URL: http://sampleapp:8081
      BACKEND_URL: http://backend:8080
      COLLECT_INTERVAL: 3s
    depends_on:
      backend:
        condition: service_healthy
      sampleapp:
        condition: service_healthy
volumes:
  pulse-data:
